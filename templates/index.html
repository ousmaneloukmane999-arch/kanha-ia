<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanha AI - Sans Filtre</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { background-color: #0a0a0a; color: #fff; height: 100vh; display: flex; flex-direction: column; }
  
  /* Header */
  .header { background: #111; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ff0000; }
  .logo { font-size: 22px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; }
  .logo span { color: #ff0000; }
  .status { font-size: 12px; color: #4CAF50; display: flex; align-items: center; gap: 5px; }
  .dot { width: 8px; height: 8px; background: #4CAF50; border-radius: 50%; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

  /* Chat Box */
  #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
  .msg { max-width: 85%; padding: 15px; border-radius: 12px; font-size: 15px; line-height: 1.5; word-wrap: break-word; }
  .me { background: #1a1a1a; align-self: flex-end; border-bottom-right-radius: 2px; color: #ddd; }
  .ia { background: #1a0000; border: 1px solid #ff000033; align-self: flex-start; border-bottom-left-radius: 2px; color: #fff; }
  .ia strong { color: #ff0000; }

  /* Input Area */
  .input-area { background: #111; padding: 15px; display: flex; gap: 10px; border-top: 1px solid #222; }
  input[type="text"] { flex: 1; padding: 15px; border-radius: 8px; border: 1px solid #333; background: #0a0a0a; color: #fff; font-size: 15px; outline: none; }
  input[type="text"]:focus { border-color: #ff0000; }
  button { padding: 0 20px; background: #ff0000; color: #fff; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.2s; }
  button:active { transform: scale(0.95); }
</style>
</head>
<body>

<div class="header">
  <div class="logo">Kanha <span>AI</span></div>
  <div class="status"><div class="dot"></div> En ligne</div>
</div>

<div id="chat-box">
  <div class="msg ia"><strong>Kanha:</strong> Le roost est ouvert. Pose ta question. Je réponds à tout, sans filtre.</div>
</div>

<div class="input-area">
  <input type="text" id="question" placeholder="Pose ta question à Kanha..." onkeypress="if(event.key === 'Enter') sendMsg()">
  <button onclick="sendMsg()">Envoyer</button>
</div>

<script>
async function sendMsg() {
  const input = document.getElementById('question');
  const q = input.value.trim();
  if(!q) return;
  
  const box = document.getElementById('chat-box');
  
  box.innerHTML += `<div class="msg me">${q}</div>`;
  input.value = '';
  box.scrollTop = box.scrollHeight;
  
  const loadingId = 'loading-' + Date.now();
  box.innerHTML += `<div class="msg ia" id="${loadingId}"><strong>Kanha:</strong> <span style="color:#888;">Analyse en cours...</span></div>`;
  box.scrollTop = box.scrollHeight;
  
  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question: q})
    });
    const data = await res.json();
    document.getElementById(loadingId).innerHTML = `<strong>Kanha:</strong> ${data.answer}`;
  } catch (e) {
    document.getElementById(loadingId).innerHTML = `<strong>Kanha:</strong> Erreur de connexion au roost.`;
  }
  box.scrollTop = box.scrollHeight;
}
</script>
</body>
</html>
